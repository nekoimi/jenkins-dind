name: CR Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - README.md
      - example
      - LICENSE
  schedule:
    # https://crontab.cronhub.io/
    - cron: '00 5 * * 1'

jobs:
  build_and_push:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Jenkins version
        id: get_jenkins_version
        run: |
          jenkins_version=$(docker run --rm docker.io/jenkins/jenkins:lts-jdk21 unzip -p /usr/share/jenkins/jenkins.war META-INF/MANIFEST.MF | grep Jenkins-Version | awk '{print $2}')
          echo "Extracted Jenkins version: $jenkins_version"
          echo "jenkins_version=$jenkins_version" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_jenkins_version.outputs.jenkins_version }}
            type=schedule,pattern={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}}

      - name: Change metadata
        run: |
          echo "${{ steps.get_jenkins_version.outputs.jenkins_version }}" > JENKINS_VERSION
          echo "${{ steps.meta.outputs.json }}" > docker-metadata.json

      - name: Auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: automated change metadata

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
